<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10253b"><title>3D-Druck Preisrechner</title><link rel="icon" type="image/png" href="favicon.png"><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#142338;background:#edf3f8}*{box-sizing:border-box}body{margin:0;padding:22px 14px}main{max-width:520px;margin:auto}header{margin:10px 0 22px}h1{font-size:1.7rem;margin:0 0 5px}p{color:#64748b;margin:0}.card{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 22px #1e35500d}.field{margin:0 0 22px}.field:last-child{margin-bottom:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}label{font-weight:650}input[type=number]{width:105px;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem;text-align:right;color:#142338;background:#fff}input[type=range]{width:100%;accent-color:#1478d4;cursor:pointer}.total{background:#10253b;color:white}.total small{color:#b4c7dc}.price{font-size:2.5rem;font-weight:800;margin:6px 0 14px}.line{display:flex;justify-content:space-between;padding:7px 0;gap:8px}.line span:first-child{color:#617083}.total .line span:first-child{color:#b4c7dc}.actions{display:flex;gap:10px}.actions button{flex:1;background:#1478d4;color:white;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:1rem;cursor:pointer}.actions button.secondary{background:#e5eef7;color:#10253b}.hint{font-size:.83rem;text-align:center;margin:15px 0 30px}hr{border:0;border-top:1px solid #334960;margin:12px 0}@media(min-width:600px){body{padding-top:45px}}</style></head><body><main><header><h1>🖨️ 3D-Druck Preisrechner</h1><p>Filament + Druckernutzung + CAD-Modellierung · CHF</p></header><section class="card"><div class="field"><div class="top"><label for="grams">Filamentverbrauch (g)</label><input id="grams" type="number" min="0" max="10000" step="1" value="100"></div><input aria-label="Filamentverbrauch einstellen" id="gramsRange" type="range" min="0" max="500" step="5" value="100"></div><div class="field"><div class="top"><label for="hours">Druckzeit (Stunden)</label><input id="hours" type="number" min="0" max="1000" step="0.25" value="1"></div><input aria-label="Druckzeit einstellen" id="hoursRange" type="range" min="0" max="24" step="0.25" value="1"></div><div class="field"><div class="top"><label for="rate">Druckernutzung (CHF/h)</label><input id="rate" type="number" min="0" max="1000" step="0.1" value="2"></div><input aria-label="Stundentarif einstellen" id="rateRange" type="range" min="0" max="5" step="0.1" value="2"></div><div class="field"><div class="top"><label for="kg">Filamentpreis (CHF/kg)</label><input id="kg" type="number" min="0" max="10000" step="0.5" value="30"></div><input aria-label="Filamentpreis einstellen" id="kgRange" type="range" min="0" max="100" step="0.5" value="30"></div><div class="field"><div class="top"><label for="cadHours">CAD-Modellierung (Stunden)</label><input id="cadHours" type="number" min="0" max="1000" step="0.25" value="0"></div><input aria-label="CAD-Arbeitszeit einstellen" id="cadHoursRange" type="range" min="0" max="24" step="0.25" value="0"></div><div class="field"><div class="top"><label for="cadRate">CAD-Stundensatz (CHF/h)</label><input id="cadRate" type="number" min="0" max="1000" step="1" value="25"></div><input aria-label="CAD-Stundensatz einstellen" id="cadRateRange" type="range" min="0" max="100" step="1" value="25"></div></section><section class="card total"><small>Gesamtpreis</small><div class="price" id="total">CHF 5.00</div><div class="line"><span>Filament</span><strong id="material">CHF 3.00</strong></div><div class="line"><span>Druckernutzung inkl. Strom</span><strong id="machine">CHF 2.00</strong></div><div class="line"><span>CAD-Modellierung</span><strong id="cad">CHF 0.00</strong></div><hr><div class="line"><span>Gerundeter Preis (optional)</span><strong id="rounded">CHF 5.00</strong></div></section><div class="actions"><button id="copy">Berechnung kopieren</button><button id="reset" class="secondary">Zurücksetzen</button></div><p class="hint">Alle Berechnungen erfolgen lokal. Die Werte werden auf diesem Gerät gespeichert.</p></main><script>const ids=['grams','hours','rate','kg','cadHours','cadRate'],defaults={grams:100,hours:1,rate:2,kg:30,cadHours:0,cadRate:25},fmt=n=>'CHF '+n.toFixed(2);const get=id=>Math.max(0,Number(document.getElementById(id).value)||0);function update(){const g=get('grams'),h=get('hours'),r=get('rate'),kg=get('kg'),m=g*kg/1000,d=h*r,c=get('cadHours')*get('cadRate'),t=m+d+c;document.getElementById('material').textContent=fmt(m);document.getElementById('machine').textContent=fmt(d);document.getElementById('cad').textContent=fmt(c);document.getElementById('total').textContent=fmt(t);document.getElementById('rounded').textContent=fmt(Math.round(t));try{localStorage.setItem('druckrechner',JSON.stringify(Object.fromEntries(ids.map(id=>[id,get(id)]))))}catch(e){}}let stored={};try{stored=JSON.parse(localStorage.getItem('druckrechner')||'{}')}catch(e){}for(const id of ids){const input=document.getElementById(id),range=document.getElementById(id+'Range');input.value=Number.isFinite(Number(stored[id]))&&stored[id]!==undefined?stored[id]:defaults[id];range.value=input.value;input.addEventListener('input',()=>{range.value=input.value;update()});range.addEventListener('input',()=>{input.value=range.value;update()})}document.getElementById('reset').onclick=()=>{for(const id of ids){document.getElementById(id).value=defaults[id];document.getElementById(id+'Range').value=defaults[id]}update()};document.getElementById('copy').onclick=async()=>{const g=get('grams'),h=get('hours'),r=get('rate'),kg=get('kg'),ch=get('cadHours'),cr=get('cadRate'),t=g*kg/1000+h*r+ch*cr;const s=`3D-Druck Preisberechnung\nFilament: ${g} g × CHF ${kg.toFixed(2)}/kg = ${fmt(g*kg/1000)}\nDruckernutzung: ${h} h × ${fmt(r)}/h = ${fmt(h*r)}\nCAD-Modellierung: ${ch} h × ${fmt(cr)}/h = ${fmt(ch*cr)}\nTotal: ${fmt(t)}`;try{await navigator.clipboard.writeText(s);document.getElementById('copy').textContent='Kopiert ✓';setTimeout(()=>document.getElementById('copy').textContent='Berechnung kopieren',1800)}catch(e){prompt('Berechnung kopieren:',s)}};update();</script></body></html>
